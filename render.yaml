# Render Blueprint — KEPWE (single-service deployment)
# Docs: https://render.com/docs/blueprint-spec
#
# This defines ONE web service that:
#   1. Builds the React/Vite frontend into `dist/`
#   2. Installs the Express backend dependencies
#   3. Runs the Express server, which serves the built frontend AND the
#      `/api/*` routes from the same process/port.
#
# To use: push this repo to GitHub/GitLab, then in the Render dashboard
# choose "New +" -> "Blueprint" and point it at this repo. Render will read
# this file automatically. Secret values (marked sync: false) must be filled
# in manually in the Render dashboard after the service is created.

services:
  - type: web
    name: kepwe-app
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render sets PORT automatically; the app reads it via process.env.PORT.
      - key: SUPABASE_DB_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
